name: Monthly WASDE update

on:
  schedule:
    - cron: '0 20 12 * *'   # 12th of every month, 8pm UTC
  workflow_dispatch:          # manual trigger anytime

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push JSONs + upload release assets

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas curl_cffi python-dateutil -q

      - name: Run full pipeline
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python process.py full

      - name: Commit & push updated JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || \
            git commit -m "data: WASDE update $(date +'%Y-%m')" && git push
