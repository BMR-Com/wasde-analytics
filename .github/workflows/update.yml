name: Monthly WASDE update

on:
  schedule:
    - cron: '0 20 9 * *'   # Run on 9th, 10th, 11th, 12th to catch release
    - cron: '0 20 10 * *'
    - cron: '0 20 11 * *'
    - cron: '0 20 12 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy curl_cffi python-dateutil -q

      - name: Run pipeline
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          MASTER_CSV_PATH:    master_wasde.csv
        run: python process.py full   # <-- CHANGED: was json-from-release

      - name: Commit & push updated JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: WASDE update $(date +'%Y-%m')"
            git push
          fi
